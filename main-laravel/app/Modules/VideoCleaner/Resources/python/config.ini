# Performance Optimization Configuration
# Adjust these values based on your hardware and video characteristics

[processing]
# Frame extraction settings
extraction_fps = 1  # Lower = faster processing, higher = better quality
max_video_length = 3600  # Maximum video length in seconds (1 hour)

# Detection optimization
detection_interval = 30  # Detect watermark every N frames
use_ocr = true  # Enable OCR fallback (slower but more accurate)
use_template_matching = true  # Use template if available

# Cleaning settings
inpaint_method = telea  # telea (faster) or ns (better quality)
inpaint_radius = 3  # Smaller = faster, larger = better blending
adaptive_cleaning = true  # Reuse detected masks

# Resource limits
max_memory_gb = 8  # Maximum memory usage
cpu_threads = 4  # Number of CPU threads to use

[quality]
# Quality vs speed trade-offs
frame_quality = 95  # JPEG quality for frame saving (1-100)
video_quality = 23  # FFmpeg CRF (0-51, lower = better quality)

[monitoring]
# Performance monitoring
log_performance = true
track_memory_usage = true
benchmark_mode = false  # Enable detailed timing